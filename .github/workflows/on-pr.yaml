name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# The committed go.work is for local multi-module development. CI validates each
# module in isolation via the module-scoped Makefile targets (which rely on the
# in-repo `replace` directives), so disable workspace mode here for parity.
env:
  GOWORK: "off"

jobs:
  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    # Each first-party module is its own go.mod, so lint them individually — a
    # single root invocation (GOWORK=off) only covers the root module and misses
    # operator, api, pkg and metricsd. The shared root .golangci.yml is picked up
    # by config discovery from each module dir.
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - api
          - operator
          - pkg
          - sharing-manager/metricsd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: ${{ matrix.module }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build

  smoke-nvml:
    name: Smoke / NVML collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: sharing-manager/metricsd/go.mod
      - run: make -C sharing-manager/metricsd smoke-nvml
