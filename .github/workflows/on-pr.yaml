name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# The committed go.work is for local multi-module development. CI validates each
# module in isolation via the module-scoped Makefile targets (which rely on the
# in-repo `replace` directives), so disable workspace mode here for parity.
env:
  GOWORK: "off"

jobs:
  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    # Each first-party module is its own go.mod, so lint them individually — a
    # single root invocation (GOWORK=off) only covers the root module and misses
    # operator, api, pkg and metricsd. The shared root .golangci.yml is picked up
    # by config discovery from each module dir.
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - api
          - operator
          - pkg
          - fractioning-manager/metricsd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12
          working-directory: ${{ matrix.module }}

  license:
    name: License headers
    runs-on: ubuntu-latest
    # Apache-2.0 SPDX headers are an OSS-compliance requirement, not a style
    # preference: every authored file in every module, the Helm chart, the
    # Dockerfiles and the CI config must carry one. Gate it in its own job so a
    # missing header is unambiguous in the PR checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make license-check
      # THIRD-PARTY.txt is attribution for what we actually ship, so it has to
      # track the linked dependency set — a dependency bump that changes it must
      # regenerate it in the same PR.
      - run: make third-party-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make build

  smoke-nvml:
    name: Smoke / NVML collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: fractioning-manager/metricsd/go.mod
      - run: make -C fractioning-manager/metricsd smoke-nvml
