name: Build & Publish (main)

# Publishes dev artifacts on every push to main: the four component images and
# the Helm chart, all under ghcr.io/kai-scheduler/gpu-sharing. Versioned
# 0.0.0-<short-sha> so dev installs are pinnable. Tagged releases (v*) are
# handled by the release workflow added in Phase 2.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  GOWORK: "off"
  DOCKER_REPO_BASE: ghcr.io/kai-scheduler/gpu-sharing

jobs:
  build-publish:
    name: Build and publish to ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@v3

      - uses: azure/setup-helm@v4

      - name: Resolve dev version
        id: version
        run: echo "VERSION=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: make docker-build docker-push VERSION=${{ steps.version.outputs.VERSION }}

      - name: Package and push Helm chart
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          helm package operator/charts --version "$VERSION" --app-version "$VERSION" -d ./dist
          helm push "./dist/gpu-sharing-operator-$VERSION.tgz" "oci://${DOCKER_REPO_BASE}"
