name: Stale Issues

on:
  schedule:
    - cron: "21 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log intended changes without modifying issues
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  stale:
    name: Apply 90+30 issue policy
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
    steps:
      - name: Process inactive issues
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 90
          days-before-issue-close: 30
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: lifecycle/stale
          exempt-issue-labels: lifecycle/frozen
          stale-issue-message: >-
            This issue has had no activity for 90 days and is now marked stale.
            It will close automatically after another 30 days without activity.
            A maintainer may add `lifecycle/frozen` to exempt it from this policy.
          close-issue-message: >-
            This issue was closed automatically after 120 days without activity.
            If the problem is still relevant, open a new issue with current details.
          close-issue-reason: not_planned
          remove-issue-stale-when-updated: true
          operations-per-run: 1000
          debug-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
