name: "Image Build Setup"
description: >-
  Install the image build toolchain (Go, QEMU, buildx), log in to ghcr and
  resolve the artifact version and platform list. Shared by the regular and FIPS
  image jobs, which are otherwise identical apart from the FIPS build flag.
  The caller must check out the repo first: a local composite action cannot
  check out the repo it lives in.

inputs:
  version:
    description: >-
      Release version, e.g. v0.1.0. Empty for a dev build off main, which
      resolves to 0.0.0-<short-sha> and builds a single architecture.
    required: false
    default: ""
  registry-username:
    description: "ghcr.io username."
    required: true
  registry-password:
    description: >-
      ghcr.io token. Secrets are not readable from inside a composite action,
      so the caller has to pass it in.
    required: true

outputs:
  version:
    description: "Resolved artifact version."
    value: ${{ steps.cfg.outputs.version }}
  platforms:
    description: "Comma-separated platform list to build."
    value: ${{ steps.cfg.outputs.platforms }}

runs:
  using: "composite"
  steps:
    # Also used after the build, to read Go build info out of the published
    # binaries during crypto verification.
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # QEMU/binfmt is required to build metricsd's non-native arch: its Dockerfile
    # builds on $TARGETPLATFORM (cgo/NVML), so the arm64 build runs arm64 binaries
    # on the amd64 runner. Must precede setup-buildx-action.
    - uses: docker/setup-qemu-action@v4

    - uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Resolve version and platforms
      id: cfg
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_VERSION" ]; then
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
        else
          echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
        fi
