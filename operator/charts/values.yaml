replicaCount: 1
leaderElect: true

images:
  operator:
    repository: gcr.io/run-ai-prod/gpu-sharing-operator
    tag: ""
    pullPolicy: IfNotPresent
  sharingd:
    repository: gcr.io/run-ai-prod/sharingd
    tag: ""
    pullPolicy: IfNotPresent
  metricsd:
    repository: gcr.io/run-ai-prod/metricsd
    tag: ""
    pullPolicy: IfNotPresent
  mpsd:
    repository: gcr.io/run-ai-prod/mpsd
    tag: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# mpsd configures the MPS daemon (mpsd) managed by the operator.
mpsd:
  # auditLog toggles features.memacct.audit_log in the generated MPS
  # control-daemon config (nvidia-cuda-mps-control -a). memacct itself is always
  # enabled and context-share always disabled.
  auditLog: true

# metricsAgent configures the metricsd sidecar. injectEnv/injectVolumeMounts/
# injectVolumes are operator-level overrides injected via the operator pod's
# own env vars (not the CRD API). Empty by default; the e2e overlay sets them
# to wire the nvml-mock driver into metricsd on fake-GPU clusters.
metricsAgent:
  enabled: true
  injectEnv: []
  injectVolumeMounts: []
  injectVolumes: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  operator:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
