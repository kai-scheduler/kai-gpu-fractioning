replicaCount: 1
leaderElect: true

images:
  operator:
    repository: gcr.io/run-ai-prod/gpu-sharing-operator
    tag: ""
    pullPolicy: IfNotPresent
  sharingd:
    repository: gcr.io/run-ai-prod/sharingd
    tag: ""
    pullPolicy: IfNotPresent
  metricsd:
    repository: gcr.io/run-ai-prod/metricsd
    tag: ""
    pullPolicy: IfNotPresent
  mpsd:
    repository: gcr.io/run-ai-prod/mpsd
    tag: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# metricsAgent exposes advanced pass-through knobs for the metricsd sidecar in
# the operator-managed default GpuSharingConfig. Empty by default (prod
# unaffected); a non-standard deployment (e.g. the e2e fake-GPU cluster) can
# supply extra env/mounts/volumes via a values override to point the collector
# at an alternate driver library.
metricsAgent:
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  operator:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
