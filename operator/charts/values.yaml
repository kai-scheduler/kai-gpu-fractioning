replicaCount: 1
leaderElect: true

images:
  operator:
    repository: ghcr.io/kai-scheduler/gpu-sharing/operator
    tag: ""
    pullPolicy: IfNotPresent
  sharingd:
    repository: ghcr.io/kai-scheduler/gpu-sharing/sharingd
    tag: ""
    pullPolicy: IfNotPresent
  metricsd:
    repository: ghcr.io/kai-scheduler/gpu-sharing/metricsd
    tag: ""
    pullPolicy: IfNotPresent
  mpsd:
    repository: ghcr.io/kai-scheduler/gpu-sharing/mpsd
    tag: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# mpsd configures the MPS daemon (mpsd) managed by the operator.
mpsd:
  # auditLog toggles features.memacct.audit_log in the generated MPS
  # control-daemon config (nvidia-cuda-mps-control -a). memacct itself is always
  # enabled and context-share always disabled.
  auditLog: true

metricsAgent:
  enabled: true
  runtimeClassName: "nvidia"
  # metricNames overrides the exported Prometheus metric names. Leave empty to
  # keep the built-in gpu_sharing_* names. Set them to integrate with a consumer
  # that expects specific names. Labels are fixed: namespace, pod, pod_uuid,
  # gpu_uuid, gpu.
  metricNames: {}
    # gpuMemoryUsedBytes: <metric name>
    # gpuSmUtilizationPercent: <metric name>
    # gpuSmUtilizationPercentNormalized: <metric name>

serviceAccount:
  create: true
  name: ""
  annotations: {}

# metrics configures the controller's Prometheus metrics endpoint. It is served
# securely (HTTPS + controller-runtime authn/authz) on `port`; enabling it also
# creates the auth-delegator binding the authz filter needs.
metrics:
  enabled: true
  port: 8443
  secure: true
  serviceMonitor:
    # Create a ServiceMonitor (controller) + PodMonitor (metricsd sidecars).
    # Requires the Prometheus Operator CRDs; templates no-op without them.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # The controller serves a self-signed cert by default, so skip verification.
    # Point tlsConfig at a CA instead if you front it with a real certificate.
    insecureSkipVerify: true
    # Extra labels for the ServiceMonitor/PodMonitor (e.g. a Prometheus `release`
    # selector label) so your Prometheus instance selects them.
    additionalLabels: {}

resources:
  operator:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
