replicaCount: 1
leaderElect: true

images:
  operator:
    repository: ghcr.io/kai-scheduler/gpu-sharing/operator
    tag: ""
    pullPolicy: IfNotPresent
  sharingd:
    repository: ghcr.io/kai-scheduler/gpu-sharing/sharingd
    tag: ""
    pullPolicy: IfNotPresent
  metricsd:
    repository: ghcr.io/kai-scheduler/gpu-sharing/metricsd
    tag: ""
    pullPolicy: IfNotPresent
  mpsd:
    repository: ghcr.io/kai-scheduler/gpu-sharing/mpsd
    tag: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# mpsd configures the MPS daemon (mpsd) managed by the operator.
mpsd:
  # auditLog toggles features.memacct.audit_log in the generated MPS
  # control-daemon config (nvidia-cuda-mps-control -a). memacct itself is always
  # enabled and context-share always disabled.
  auditLog: true

metricsAgent:
  enabled: true
  runtimeClassName: "nvidia"
  # metricNames overrides the exported Prometheus metric names. Leave empty to
  # keep the built-in gpu_sharing_* names. Set them to integrate with a consumer
  # that expects specific names. Labels are fixed: namespace, pod, pod_uuid,
  # gpu_uuid, gpu.
  metricNames: {}
    # gpuMemoryUsedBytes: <metric name>
    # gpuSmUtilizationPercent: <metric name>
    # gpuSmUtilizationPercentNormalized: <metric name>

serviceAccount:
  create: true
  name: ""
  annotations: {}

# metrics configures the controller's Prometheus metrics endpoint, served over
# plain HTTP on `port` (matching the metricsd GPU metrics and KAI-Scheduler).
metrics:
  # Serve controller metrics over plain HTTP on this port ("0" disables).
  enabled: true
  port: 8080

# Prometheus-Operator integration. When enabled (and the monitoring.coreos.com/v1
# CRDs are present), installs a ServiceMonitor for the controller metrics and a
# PodMonitor for the metricsd per-pod GPU metrics. Both scrape plain HTTP.
prometheus:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels on the ServiceMonitor/PodMonitor (e.g. a Prometheus `release`
  # selector label) so your Prometheus instance selects them.
  additionalLabels: {}

resources:
  operator:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
