fractioningAgent:
  logLevel: debug

# k3d has no real "nvidia" runtime; clear it so daemon pods use the node default.
# The e2e images provide the fake NVIDIA/NVML pieces they need.
runtimeClassName: ""

metricsAgent:
  logLevel: debug
  # Mount the nvml-mock config so the baked-in libnvidia-ml.so reads the
  # test-controlled driver/process state via MOCK_NVML_CONFIG at nvmlInit time.
  volumes:
    - name: nvml-mock-cfg
      configMap:
        name: nvml-mock-config
  volumeMounts:
    - name: nvml-mock-cfg
      mountPath: /etc/nvml-mock
      readOnly: true
