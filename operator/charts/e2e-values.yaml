fractioningAgent:
  logLevel: debug

metricsAgent:
  # k3d has no real "nvidia" runtime; clear it so fractiond pods schedule.
  # metricsd gets NVML from the e2e image's baked-in nvml-mock.
  runtimeClassName: ""
  logLevel: debug
  # Mount the nvml-mock config so the baked-in libnvidia-ml.so reads the
  # test-controlled driver/process state via MOCK_NVML_CONFIG at nvmlInit time.
  volumes:
    - name: nvml-mock-cfg
      configMap:
        name: nvml-mock-config
  volumeMounts:
    - name: nvml-mock-cfg
      mountPath: /etc/nvml-mock
      readOnly: true
