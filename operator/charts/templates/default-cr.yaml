apiVersion: gpu-sharing.run.ai/v1alpha1
kind: GpuSharingConfig
metadata:
  name: default
  labels:
    {{- include "gpu-sharing-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
spec:
  nodeSelector:
    nvidia.com/gpu.present: "true"
  # Present (even if empty) so the API server applies field-level defaults such
  # as sharingAgent.retroactiveEnforcement=true.
  sharingAgent: {}
  metricsAgent:
    enabled: {{ .Values.metricsAgent.enabled }}
    {{- if hasKey .Values.metricsAgent "runtimeClassName" }}
    runtimeClassName: {{ .Values.metricsAgent.runtimeClassName | quote }}
    {{- end }}
    {{- with .Values.metricsAgent.metricNames }}
    metricNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
