apiVersion: gpu-sharing.run.ai/v1alpha1
kind: GpuSharingConfig
metadata:
  name: default
  labels:
    {{- include "gpu-sharing-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
spec:
  nodeSelector:
    nvidia.com/gpu.present: "true"
  # Present (even if empty) so the API server applies field-level defaults such
  # as sharingAgent.retroactiveEnforcement=true.
  {{- if and .Values.sharingAgent .Values.sharingAgent.logLevel }}
  sharingAgent:
    logLevel: {{ .Values.sharingAgent.logLevel | quote }}
  {{- else }}
  sharingAgent: {}
  {{- end }}
  metricsAgent:
    enabled: {{ .Values.metricsAgent.enabled }}
    {{- if hasKey .Values.metricsAgent "runtimeClassName" }}
    runtimeClassName: {{ .Values.metricsAgent.runtimeClassName | quote }}
    {{- end }}
    {{- if .Values.metricsAgent.logLevel }}
    logLevel: {{ .Values.metricsAgent.logLevel | quote }}
    {{- end }}
    {{- if .Values.metricsAgent.volumes }}
    volumes:
      {{- toYaml .Values.metricsAgent.volumes | nindent 6 }}
    {{- end }}
    {{- if .Values.metricsAgent.volumeMounts }}
    volumeMounts:
      {{- toYaml .Values.metricsAgent.volumeMounts | nindent 6 }}
    {{- end }}
