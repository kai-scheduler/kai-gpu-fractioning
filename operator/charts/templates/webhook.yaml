{{- $svcName := include "gpu-sharing-operator.webhookServiceName" . }}
{{- $secretName := include "gpu-sharing-operator.webhookCertSecretName" . }}
{{- $svcDNS := printf "%s.%s.svc" $svcName .Release.Namespace }}
{{- $svcDNSFull := printf "%s.%s.svc.cluster.local" $svcName .Release.Namespace }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $cert := "" }}
{{- $key := "" }}
{{- if $secret }}
{{- $cert = index $secret.data "tls.crt" }}
{{- $key = index $secret.data "tls.key" }}
{{- else }}
{{- $generated := genSelfSignedCert $svcDNS nil (list $svcDNS $svcDNSFull) 3650 }}
{{- $cert = $generated.Cert | b64enc }}
{{- $key = $generated.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-sharing-operator.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert }}
  tls.key: {{ $key }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "gpu-sharing-operator.fullname" . }}
  labels:
    {{- include "gpu-sharing-operator.labels" . | nindent 4 }}
webhooks:
  - name: vgpusharingconfig.gpu-sharing.run.ai
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ .Release.Namespace }}
        path: /validate-gpu-sharing-run-ai-v1alpha1-gpusharingconfig
        port: 443
      caBundle: {{ $cert }}
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["gpu-sharing.run.ai"]
        apiVersions: ["v1alpha1"]
        resources: ["gpusharingconfigs"]
