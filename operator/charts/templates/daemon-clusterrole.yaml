apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-fractioning.fullname" . }}-daemon
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
rules:
  # The fractiond driver-labeler init container patches only its own node's
  # gpu-fractioning-owned NVIDIA driver-major label.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - patch
