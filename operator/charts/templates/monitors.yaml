{{- if and .Values.metrics.enabled .Values.prometheus.enabled }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
# Controller metrics: reconcile counters + node/daemon gauges, scraped over plain
# HTTP from the metrics Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gpu-fractioning.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
    {{- with .Values.prometheus.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "gpu-fractioning.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      scheme: http
      path: /metrics
      interval: {{ .Values.prometheus.interval }}
      scrapeTimeout: {{ .Values.prometheus.scrapeTimeout }}
---
# metricsd sidecars: per-pod GPU metrics on the fractiond DaemonSet pods. A single
# PodMonitor discovers every metricsd pod — Prometheus creates one scrape target
# per pod, i.e. one per GPU node.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "gpu-fractioning.fullname" . }}-metricsd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
    {{- with .Values.prometheus.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # These values are fixed literals on purpose: the daemon pods are labelled by
  # the operator (daemonmgr.ManagedByValue = "gpu-fractioning" and the component
  # name), not by Helm. The gpu-fractioning.name helper would follow nameOverride and
  # stop matching the operator-set label, so it must not be used here.
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: gpu-fractioning
      app.kubernetes.io/component: fractiond
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.prometheus.interval }}
{{- end }}
{{- end }}
