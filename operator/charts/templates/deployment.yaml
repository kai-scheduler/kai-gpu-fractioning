apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu-fractioning.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gpu-fractioning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpu-fractioning.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gpu-fractioning.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: "{{ .Values.images.operator.repository }}:{{ .Values.images.operator.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.images.operator.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FRACTIOND_IMAGE_REPOSITORY
              value: {{ .Values.images.fractiond.repository | quote }}
            - name: FRACTIOND_IMAGE_TAG
              value: {{ .Values.images.fractiond.tag | default .Chart.AppVersion | quote }}
            - name: FRACTIOND_IMAGE_PULL_POLICY
              value: {{ .Values.images.fractiond.pullPolicy | quote }}
            - name: METRICSD_IMAGE_REPOSITORY
              value: {{ .Values.images.metricsd.repository | quote }}
            - name: METRICSD_IMAGE_TAG
              value: {{ .Values.images.metricsd.tag | default .Chart.AppVersion | quote }}
            - name: METRICSD_IMAGE_PULL_POLICY
              value: {{ .Values.images.metricsd.pullPolicy | quote }}
            - name: MPSD_IMAGE_REPOSITORY
              value: {{ .Values.images.mpsd.repository | quote }}
            - name: MPSD_IMAGE_TAG
              value: {{ .Values.images.mpsd.tag | default .Chart.AppVersion | quote }}
            - name: MPSD_IMAGE_PULL_POLICY
              value: {{ .Values.images.mpsd.pullPolicy | quote }}
            - name: MPSD_AUDIT_LOG
              value: {{ .Values.mpsd.auditLog | quote }}
            - name: SUPPORT_SM_SHARING
              value: {{ .Values.supportSmSharing | quote }}
            - name: DAEMON_SERVICE_ACCOUNT_NAME
              value: {{ include "gpu-fractioning.daemonServiceAccountName" . | quote }}
          args:
            {{- if .Values.leaderElect }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:8081
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            # Plain HTTP: the metricsd GPU metrics are already unsecured and KAI
            # exposes controller metrics the same way; restrict with a
            # NetworkPolicy if needed.
            - --metrics-secure=false
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources.operator }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
