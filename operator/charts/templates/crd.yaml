apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpusharingconfigs.gpu-sharing.run.ai
  labels:
    {{- include "gpu-sharing-operator.labels" . | nindent 4 }}
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
spec:
  group: gpu-sharing.run.ai
  names:
    kind: GpuSharingConfig
    listKind: GpuSharingConfigList
    plural: gpusharingconfigs
    singular: gpusharingconfig
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: GpuSharingConfig is the Schema for the gpusharingconfigs API
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: "self.metadata.name == 'default'"
              message: "GpuSharingConfig must be named 'default'"
          properties:
            apiVersion:
              description: >-
                APIVersion defines the versioned schema of this representation
                of an object.
              type: string
            kind:
              description: >-
                Kind is a string value representing the REST resource this
                object represents.
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired state of GpuSharingConfig
              type: object
              required:
                - nodeSelector
              properties:
                nodeSelector:
                  description: >-
                    nodeSelector determines which nodes the managed DaemonSets
                    (sharingd, mpsd) target. All daemons share the same selector.
                  type: object
                  additionalProperties:
                    type: string
                sharingAgent:
                  description: sharingAgent configures the NRI-based sharing agent (sharingd).
                  type: object
                  properties:
                    image:
                      description: image overrides the default sharingd container image.
                      type: object
                      properties:
                        repository:
                          type: string
                        tag:
                          type: string
                        imagePullPolicy:
                          type: string
                    annotationPrefix:
                      type: string
                    failOpen:
                      type: boolean
                    nriSocketPath:
                      type: string
                    logLevel:
                      type: string
                    retryInterval:
                      type: string
                    stableThreshold:
                      type: string
                    maxRetries:
                      type: integer
                      format: int32
                mpsDaemon:
                  description: mpsDaemon configures the MPS daemon supervisor (mpsd).
                  type: object
                  properties:
                    image:
                      description: image overrides the default mpsd container image.
                      type: object
                      properties:
                        repository:
                          type: string
                        tag:
                          type: string
                        imagePullPolicy:
                          type: string
                    logLevel:
                      type: string
                    backoff:
                      type: string
                    maxRetries:
                      type: integer
                      format: int32
                    stableThreshold:
                      type: string
                    gracefulStopDelay:
                      type: string
            status:
              description: status defines the observed state of GpuSharingConfig
              type: object
              properties:
                observedGeneration:
                  description: >-
                    observedGeneration is the most recent generation observed
                    by the controller.
                  format: int64
                  type: integer
                conditions:
                  description: >-
                    conditions represent the latest available observations of
                    the config's state.
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
