apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpu-sharing-operator.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-sharing-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gpu-sharing-operator.selectorLabels" . | nindent 4 }}
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
      name: webhook
