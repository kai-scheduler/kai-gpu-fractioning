apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-sharing-operator.fullname" . }}
  labels:
    {{- include "gpu-sharing-operator.labels" . | nindent 4 }}
rules:
  # Watch for GpuSharingConfig changes and read the resource.
  - apiGroups:
      - gpu-sharing.run.ai
    resources:
      - gpusharingconfigs
    verbs:
      - get
      - list
      - watch
  # Update finalizers on the CR so the controller can register cleanup
  # logic that runs before the resource is deleted.
  - apiGroups:
      - gpu-sharing.run.ai
    resources:
      - gpusharingconfigs/finalizers
    verbs:
      - update
  # Write to the status subresource to report observedGeneration
  # and conditions back to the user.
  - apiGroups:
      - gpu-sharing.run.ai
    resources:
      - gpusharingconfigs/status
    verbs:
      - get
      - patch
      - update
  # Leader election uses Lease objects to ensure only one controller
  # instance is active at a time.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - patch
      - update
      - watch
  # Manage DaemonSets created by the controller for each managed daemon
  # (sharingd, mpsd).
  - apiGroups:
      - apps
    resources:
      - daemonsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Read individual nodes to preserve LastTransitionTime when patching
  # conditions. Only "get" is needed: nodes are read via the uncached API
  # reader (a targeted Get), not a cached list/watch informer.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
  # Patch the gpu-sharing.nvidia.com/Ready condition on GPU nodes.
  - apiGroups:
      - ""
    resources:
      - nodes/status
    verbs:
      - get
      - patch
  # List pods to determine per-node health for node condition patching.
  # Read via the uncached API reader (no pod informer), so no "watch" verb.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  # Emit Kubernetes Events to surface reconciliation activity
  # (e.g. "GpuSharingConfig reconciled successfully").
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
