# gpu-sharing-plugin: NRI mapper + metrics DaemonSet.
#
# Purpose: run the NRI plugin on each GPU node so it:
#   1. Writes container→pod mapping files to a shared host directory.
#   2. Exports per-pod GPU metrics on :2112/metrics (Prometheus pull).
#
# Prerequisites on the node's container runtime:
#   - containerd >= 1.7 with NRI ENABLED:
#       [plugins."io.containerd.nri.v1.nri"]
#         disable = false
#     and the NRI socket present at /var/run/nri/nri.sock
#   - NVIDIA GPU with drivers installed (NVML must be accessible).
#   - The node must have NVIDIA device nodes (major 195).
---
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-sharing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-sharing-plugin-config
  namespace: gpu-sharing
data:
  # Mounted at the binary's DefaultConfigPath (/etc/gpu-sharing-plugin/config.yaml).
  config.yaml: |
    logPodEvents: true
    mapDir: /var/run/gpu-sharing/map
    # gpuFractionAnnotation: pod annotation key whose value is the requested GPU
    # fraction (e.g. "0.5"), used for gpu_sharing_gpu_sm_utilization_percent_normalized.
    # Set empty to disable normalization.
    gpuFractionAnnotation: gpu-fraction
    metrics:
      enabled: true
      address: ":2112"
      path: /metrics
      # Collect interval: how often NVML is sampled. Floor is 2s.
      interval: 5s
      # smUtilizationWindow enables sliding-window averaging of GPU SM utilization.
      # Must be greater than interval to take effect. Empty/unset disables windowing.
      smUtilizationWindow: 30s
      # procRoot: host /proc mounted into the container so the plugin can resolve
      # NVML-returned host PIDs to cgroup paths (PID→pod attribution).
      procRoot: /host/proc
      podSource: nri
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-sharing-plugin
  namespace: gpu-sharing
  labels:
    app: gpu-sharing-plugin
spec:
  selector:
    matchLabels:
      app: gpu-sharing-plugin
  template:
    metadata:
      labels:
        app: gpu-sharing-plugin
      annotations:
        # Prometheus pod auto-discovery annotations. A standard Prometheus
        # installation with pod scraping enabled will find these pods automatically.
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
        prometheus.io/path: "/metrics"
    spec:
      # Restrict to nodes that have NVIDIA GPUs — NVML is required for metrics and
      # is only present where the NVIDIA driver is installed. Non-GPU nodes have no
      # libnvidia-ml.so and the plugin crashes on startup if metrics are enabled.
      nodeSelector:
        kubernetes.io/arch: amd64
        nvidia.com/gpu.present: "true"
      tolerations:
        - operator: Exists # tolerate GPU/taint'd nodes
      containers:
        - name: gpu-sharing-plugin
          # PRIVATE registry the cluster can pull from. For a remote cluster you
          # must push here first (NOT a public repo). For Docker Desktop / kind /
          # minikube using a locally-built image, set this to gpu-sharing-plugin:dev
          # and imagePullPolicy: Never.
          # FAKE-GPU TEST image: built with `-tags e2e` (deploy/build-and-push.sh)
          # so the plugin detects the fake-gpu-operator's MOCK_NVIDIA_VISIBLE_DEVICES
          # env var. A real-gpu-cluster image (no build tags) ignores env and keys only off
          # real /dev/nvidia* device nodes, so it would record nothing on this cluster.
          image: runai.jfrog.io/op-containers-lab-virt/gpu-sharing-plugin:e2e
          # Always re-pull so a re-pushed :e2e tag is picked up on rollout restart
          # during testing.
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 2112
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: /etc/gpu-sharing-plugin/config.yaml
            - name: NRI_SOCKET_PATH
              value: /var/run/nri/nri.sock
            - name: LOG_LEVEL
              value: debug # verbose so you can watch mappings and metrics being recorded
            # Point the dynamic linker at the nvml-mock library written by the
            # nvml-mock DaemonSet (deploy/nvml-mock.yaml). On fake-GPU clusters
            # there is no real libnvidia-ml.so, so without this the plugin falls
            # back to deadCollector and reports 0 memory/SM utilization.
            - name: LD_LIBRARY_PATH
              value: /var/lib/nvml-mock/driver/usr/lib64
          securityContext:
            # Root + access to the host NRI socket, host map dir, and NVML devices.
            runAsUser: 0
            privileged: true
          volumeMounts:
            - name: nri-socket
              mountPath: /var/run/nri
            - name: map-dir
              mountPath: /var/run/gpu-sharing/map
            - name: config
              mountPath: /etc/gpu-sharing-plugin
              readOnly: true
            # Host /proc gives the metrics component access to each GPU process's
            # cgroup file (/proc/<host-pid>/cgroup) so it can map PIDs returned by
            # NVML to the Kubernetes pod that owns them.
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            # nvml-mock driver root: the library at usr/lib64/libnvidia-ml.so.1
            # auto-discovers its config at driver/config/config.yaml via
            # /proc/self/maps, so the full driver tree must be mounted at the
            # same host path the library was built into.
            - name: nvml-mock-driver
              mountPath: /var/lib/nvml-mock/driver
              readOnly: true
      volumes:
        - name: nri-socket
          hostPath:
            path: /var/run/nri
            type: Directory
        - name: map-dir
          # The .json mapping files land here on the host, so you can inspect them
          # via `kubectl exec` into the pod or directly on the node.
          hostPath:
            path: /var/run/gpu-sharing/map
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: gpu-sharing-plugin-config
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: nvml-mock-driver
          hostPath:
            path: /var/lib/nvml-mock/driver
            type: DirectoryOrCreate
---
# Service exposes the metrics port cluster-wide so Prometheus (or a
# ServiceMonitor / PodMonitor) can scrape each node's plugin instance.
apiVersion: v1
kind: Service
metadata:
  name: gpu-sharing-plugin-metrics
  namespace: gpu-sharing
  labels:
    app: gpu-sharing-plugin
spec:
  # ClusterIP: Prometheus scrapes each pod via Endpoints; the DaemonSet
  # pod-annotation discovery above also works without this Service.
  clusterIP: None # headless — one Endpoint per node for per-node scraping
  selector:
    app: gpu-sharing-plugin
  ports:
    - name: metrics
      port: 2112
      targetPort: metrics
      protocol: TCP
