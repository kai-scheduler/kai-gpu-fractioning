---
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-sharing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-sharing-plugin-config
  namespace: gpu-sharing
data:
  config.yaml: |
    logPodEvents: true
    mapDir: /var/run/gpu-sharing/map
    metrics:
      enabled: true
      address: ":2112"
      path: /metrics
      # How often NVML is sampled. Floor is 2s.
      interval: 5s
      # Sliding-window averaging of GPU SM utilization. Must be greater than
      # interval to take effect. Empty/unset disables windowing.
      smUtilizationWindow: 30s
      procRoot: /host/proc
      podSource: nri
      metricNames:
        gpuMemoryUsedBytes: runai_gpu_memory_used_bytes
        gpuSmUtilizationPercent: runai_gpu_sm_utilization_percent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-sharing-plugin
  namespace: gpu-sharing
  labels:
    app: gpu-sharing-plugin
spec:
  selector:
    matchLabels:
      app: gpu-sharing-plugin
  template:
    metadata:
      labels:
        app: gpu-sharing-plugin
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        nvidia.com/gpu.present: "true"
      tolerations:
        - operator: Exists
      # NVML GetComputeRunningProcesses enumerates GPU processes using host PIDs.
      # Without hostPID the plugin's PID namespace is isolated and recent NVML
      # versions report 0 processes even when the device files are accessible.
      hostPID: true
      containers:
        - name: gpu-sharing-plugin
          image: runai.jfrog.io/op-containers-lab-virt/gpu-sharing-plugin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 2112
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: /etc/gpu-sharing-plugin/config.yaml
            - name: NRI_SOCKET_PATH
              value: /var/run/nri/nri.sock
            - name: LOG_LEVEL
              value: info
          securityContext:
            runAsUser: 0
            privileged: true
          volumeMounts:
            - name: nri-socket
              mountPath: /var/run/nri
            - name: map-dir
              mountPath: /var/run/gpu-sharing/map
            - name: config
              mountPath: /etc/gpu-sharing-plugin
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            # NVIDIA GPU Operator installs the driver under /run/nvidia/driver.
            # Mount it at the same host path so the dynamic linker finds
            # libnvidia-ml.so without any LD_LIBRARY_PATH override.
            - name: nvidia-driver-root
              mountPath: /run/nvidia/driver
              readOnly: true
            # NVML's GetComputeRunningProcesses needs access to the NVIDIA
            # device files. GPU Operator places them under /run/nvidia/driver/dev/
            # rather than /dev/ on the host. Bind-mount each one to the expected
            # /dev/ path so NVML can open them at runtime.
            - name: nvidia-dev-ctl
              mountPath: /dev/nvidiactl
            - name: nvidia-dev-0
              mountPath: /dev/nvidia0
            - name: nvidia-dev-uvm
              mountPath: /dev/nvidia-uvm
            - name: nvidia-dev-uvm-tools
              mountPath: /dev/nvidia-uvm-tools
      volumes:
        - name: nri-socket
          hostPath:
            path: /var/run/nri
            type: Directory
        - name: map-dir
          hostPath:
            path: /var/run/gpu-sharing/map
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: gpu-sharing-plugin-config
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: nvidia-driver-root
          hostPath:
            path: /run/nvidia/driver
            type: Directory
        - name: nvidia-dev-ctl
          hostPath:
            path: /run/nvidia/driver/dev/nvidiactl
            type: CharDevice
        - name: nvidia-dev-0
          hostPath:
            path: /run/nvidia/driver/dev/nvidia0
            type: CharDevice
        - name: nvidia-dev-uvm
          hostPath:
            path: /run/nvidia/driver/dev/nvidia-uvm
            type: CharDevice
        - name: nvidia-dev-uvm-tools
          hostPath:
            path: /run/nvidia/driver/dev/nvidia-uvm-tools
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-sharing-plugin-metrics
  namespace: gpu-sharing
  labels:
    app: gpu-sharing-plugin
spec:
  clusterIP: None
  selector:
    app: gpu-sharing-plugin
  ports:
    - name: metrics
      port: 2112
      targetPort: metrics
      protocol: TCP
