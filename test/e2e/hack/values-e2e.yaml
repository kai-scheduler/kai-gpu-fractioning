metricsAgent:
  # Disable the "nvidia" RuntimeClass default: k3d's fake-GPU cluster does not
  # have this RuntimeClass (same reason mpsd never schedules there). An empty
  # string in the CR tells the operator to use the node's default runtime.
  runtimeClassName: ""
  # Verbose logging so attribution/collection steps are observable when a
  # metrics test fails.
  logLevel: debug
